<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý Toán THPT Nguyễn Hữu Cảnh</title>
    
    <style>
        :root {
            --primary-color: #0056b3;
            --primary-light: #eaf1f8;
            --bg-color: #f4f7f6;
            --panel-bg: #ffffff;
            --text-color: #333333;
            --border-color: #d1d9e6;
            --btn-hover: #004494;
            --success-color: #27ae60;
            --success-hover: #219653;
            --warning-color: #f39c12;
            --warning-hover: #d68910;
            --danger-color: #e74c3c;
            --save-color: #8e44ad;
            --save-hover: #732d91;
            --load-color: #2980b9;
            --load-hover: #1c5980;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }

        header {
            background-color: var(--primary-color);
            color: white; padding: 15px 20px; text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            font-size: 1.6rem; font-weight: 600; z-index: 10;
        }

        .container {
            display: flex; flex: 1; gap: 20px; padding: 20px; height: calc(100vh - 60px);
        }

        .panel {
            flex: 1; display: flex; flex-direction: column;
            background-color: var(--panel-bg); border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border-color); overflow: hidden;
        }

        .panel-header {
            background-color: var(--primary-light); padding: 12px 20px;
            font-weight: 600; color: var(--primary-color);
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }

        .tools { display: flex; gap: 8px; align-items: center; }

        input[type="password"] {
            padding: 6px 12px; border: 1px solid var(--border-color);
            border-radius: 6px; outline: none; width: 180px;
        }
        input[type="password"]:focus { border-color: var(--primary-color); }

        button, .file-label {
            background-color: var(--primary-color); color: white; border: none;
            padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;
            transition: background-color 0.2s; font-size: 0.95rem;
            display: inline-flex; align-items: center; justify-content: center;
        }
        button:hover { background-color: var(--btn-hover); }
        button:disabled { background-color: #95a5a6; cursor: not-allowed; }

        #insertTemplateBtn { background-color: var(--success-color); }
        #insertTemplateBtn:hover { background-color: var(--success-hover); }
        
        #saveBtn { background-color: var(--save-color); }
        #saveBtn:hover { background-color: var(--save-hover); }
        
        .file-label { background-color: var(--load-color); }
        .file-label:hover { background-color: var(--load-hover); }

        textarea#editor {
            flex: 1; border: none; padding: 20px; font-size: 1.05rem;
            font-family: 'Consolas', 'Courier New', monospace; resize: none;
            outline: none; background-color: #fafafa; line-height: 1.6;
        }

        #preview {
            flex: 1; padding: 20px; overflow-y: auto; font-size: 1.1rem;
            line-height: 1.8; background-color: var(--panel-bg);
        }

        /* --- GIAO DIỆN PHIẾU HỌC TẬP --- */
        .worksheet {
            background-color: #fff; border: 2px solid var(--primary-color);
            border-radius: 8px; padding: 25px; margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .worksheet-title {
            text-align: center; color: var(--primary-color); text-transform: uppercase;
            font-size: 1.4rem; margin-bottom: 25px; border-bottom: 2px dashed var(--primary-color);
            padding-bottom: 10px;
        }

        .question-block {
            margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color);
        }

        .question-content { font-weight: 500; margin-bottom: 12px; line-height: 1.6; }

        .mcq-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding-left: 15px; }
        .mcq-options label { cursor: pointer; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; padding: 8px; border-radius: 6px; }
        .mcq-options label:hover { background-color: var(--primary-light); }

        .tf-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .tf-table th, .tf-table td { border: 1px solid var(--border-color); padding: 10px; text-align: center; }
        .tf-table td:first-child { text-align: left; }

        .student-input {
            width: 100%; height: 100px; border: 1px dashed var(--primary-color);
            border-radius: 6px; padding: 10px; margin-top: 10px; font-family: inherit;
        }

        .submit-btn {
            background-color: var(--warning-color); width: 100%; padding: 12px;
            font-size: 1.1rem; margin-top: 10px;
        }
        .submit-btn:hover { background-color: var(--warning-hover); }

        .feedback-msg {
            display: none; text-align: center; font-size: 1.3rem; font-weight: bold;
            margin-top: 20px; padding: 15px; border-radius: 8px;
            animation: popIn 0.5s ease forwards;
        }

        /* CSS cho icon khen ngợi/báo sai ở từng câu */
        .inline-feedback {
            font-size: 0.95rem; font-weight: bold; margin-left: 5px;
            animation: popIn 0.3s ease forwards;
        }
        .inline-feedback.correct { color: var(--success-color); }
        .inline-feedback.incorrect { color: var(--danger-color); }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        @media (max-width: 768px) {
            body { overflow: auto; }
            .container { flex-direction: column; height: auto; min-height: calc(100vh - 60px); }
            .panel { min-height: 45vh; flex: none; }
            .panel-header { flex-direction: column; align-items: stretch; }
            .tools { flex-direction: column; }
            input[type="password"] { width: 100%; }
            .mcq-options { grid-template-columns: 1fr; }
        }
    </style>

    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            startup: { typeset: false }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>

    <header>Trợ lý Toán THPT Nguyễn Hữu Cảnh</header>

    <div class="container">
        <div class="panel">
            <div class="panel-header">
                <span>Soạn thảo / Nhập đề bài</span>
                <div class="tools">
                    <button id="insertTemplateBtn">📝 Chèn Mẫu</button>
                    
                    <button id="saveBtn">💾 Lưu File</button>
                    <label for="loadFile" class="file-label">📂 Mở File</label>
                    <input type="file" id="loadFile" accept=".txt" style="display: none;">
                    
                    <input type="password" id="apiKey" placeholder="Nhập API Key...">
                    <button id="solveBtn">💡 Giải Toán</button>
                </div>
            </div>
            <textarea id="editor" placeholder="Nhập mã HTML hoặc câu hỏi vào đây..."></textarea>
        </div>
        
        <div class="panel">
            <div class="panel-header">Kết quả hiển thị</div>
            <div id="preview"></div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const solveBtn = document.getElementById('solveBtn');
        const insertTemplateBtn = document.getElementById('insertTemplateBtn');
        const saveBtn = document.getElementById('saveBtn');
        const loadFileInput = document.getElementById('loadFile');
        const apiKeyInput = document.getElementById('apiKey');
        let typingTimer;

        function formatMarkdown(text) {
            let formatted = text.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            formatted = formatted.replace(/\*(.*?)\*/g, '<i>$1</i>');
            if (!text.includes('<div') && !text.includes('<table')) {
                formatted = formatted.replace(/\n/g, '<br>');
            }
            return formatted;
        }

        function renderMathJax() {
            if (window.MathJax && window.MathJax.typesetPromise) {
                MathJax.typesetClear([preview]);
                MathJax.typesetPromise([preview]).catch(err => console.error(err.message));
            }
        }

        function updatePreview() {
            preview.innerHTML = formatMarkdown(editor.value);
            renderMathJax();
        }

        editor.addEventListener('input', () => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(updatePreview, 300);
        });

        // HÀM CHẤM ĐIỂM CHI TIẾT TỪNG CÂU
        window.chamDiem = function(btn) {
            const worksheet = btn.closest('.worksheet');
            worksheet.querySelectorAll('.inline-feedback').forEach(el => el.remove());

            const groups = {};
            worksheet.querySelectorAll('input[type="radio"]').forEach(input => {
                if(!groups[input.name]) groups[input.name] = [];
                groups[input.name].push(input);
            });

            let totalMCQ = Object.keys(groups).length;
            if(totalMCQ === 0) return;

            let correctCount = 0;
            let isFullyAnswered = true;
            const praises = ["✅ Xuất sắc!", "✅ Quá đỉnh!", "✅ Giỏi quá!", "✅ Chính xác!"];

            for (let name in groups) {
                const inputs = groups[name];
                let groupAnswered = false;

                inputs.forEach(input => {
                    if (input.checked) {
                        groupAnswered = true;
                        const parentEl = input.closest('label') || input.closest('td');
                        const feedbackSpan = document.createElement('span');
                        feedbackSpan.className = 'inline-feedback';

                        if (input.getAttribute('data-correct') === 'true') {
                            correctCount++;
                            const randomPraise = praises[Math.floor(Math.random() * praises.length)];
                            feedbackSpan.innerHTML = randomPraise;
                            feedbackSpan.classList.add('correct');
                        } else {
                            feedbackSpan.innerHTML = "❌ Sai rồi";
                            feedbackSpan.classList.add('incorrect');
                        }
                        parentEl.appendChild(feedbackSpan);
                    }
                });

                if (!groupAnswered) isFullyAnswered = false;
            }

            const msgBox = worksheet.querySelector('.feedback-msg');
            msgBox.style.display = 'block';

            if (!isFullyAnswered) {
                msgBox.innerHTML = "⚠️ Thầy/Cô nhắc em cần chọn đầy đủ đáp án ở tất cả các câu trước khi nộp bài nhé!";
                msgBox.style.backgroundColor = "#fef9e7";
                msgBox.style.color = "#d35400";
            } else if (correctCount === totalMCQ) {
                msgBox.innerHTML = `🏆 BÀI LÀM HOÀN HẢO! <br> <span style="font-size:1.1rem; font-weight:normal">Em đã xuất sắc làm đúng trọn vẹn ${correctCount}/${totalMCQ} ý.</span>`;
                msgBox.style.backgroundColor = "#eafaf1";
                msgBox.style.color = "#27ae60";
            } else {
                msgBox.innerHTML = `💪 CỐ GẮNG LÊN EM! <br> <span style="font-size:1.1rem; font-weight:normal">Em trả lời đúng ${correctCount}/${totalMCQ} ý. Hãy xem lại các câu báo "Sai rồi" nhé.</span>`;
                msgBox.style.backgroundColor = "#fdedec";
                msgBox.style.color = "#c0392b";
            }
        };

        // Mẫu phiếu học tập
        const worksheetTemplate = `<div class="worksheet">
    <h3 class="worksheet-title">Phiếu Học Tập: Ứng Dụng Đạo Hàm</h3>
    
    <div class="question-block">
        <div class="question-content">
            <strong>Câu 1:</strong> Tìm giá trị lớn nhất của hàm số $y = -x^3 + 3x^2 + 1$ trên đoạn $[0; 3]$.
        </div>
        <div class="mcq-options">
            <label><input type="radio" name="q1"> A. $1$</label>
            <label><input type="radio" name="q1" data-correct="true"> B. $5$</label>
            <label><input type="radio" name="q1"> C. $3$</label>
            <label><input type="radio" name="q1"> D. $28$</label>
        </div>
    </div>

    <div class="question-block">
        <div class="question-content">
            <strong>Câu 2:</strong> Cho hàm số $f(x) = \\frac{2x+1}{x-1}$. Các mệnh đề sau đây đúng hay sai?
        </div>
        <table class="tf-table">
            <tr>
                <th>Mệnh đề</th>
                <th style="width: 70px">Đúng</th>
                <th style="width: 70px">Sai</th>
            </tr>
            <tr>
                <td>a) Tập xác định của hàm số là $D = \\mathbb{R} \\setminus \\{1\\}$.</td>
                <td><input type="radio" name="q2a"></td>
                <td><input type="radio" name="q2a" data-correct="true"></td> 
            </tr>
            <tr>
                <td>b) Đạo hàm của hàm số là $f'(x) = \\frac{-3}{(x-1)^2}$.</td>
                <td><input type="radio" name="q2b" data-correct="true"></td> 
                <td><input type="radio" name="q2b"></td>
            </tr>
        </table>
    </div>

    <button class="submit-btn" onclick="chamDiem(this)">✅ Nộp bài & Chấm điểm</button>
    <div class="feedback-msg"></div>
</div>`;

        // Sự kiện chèn mẫu
        insertTemplateBtn.addEventListener('click', () => {
            if (editor.value.trim() === "") {
                editor.value = worksheetTemplate;
            } else {
                editor.value += "\n\n" + worksheetTemplate;
            }
            updatePreview();
        });

        // Sự kiện Lưu File
        saveBtn.addEventListener('click', () => {
            const textContent = editor.value;
            if (!textContent.trim()) {
                alert("Khung soạn thảo đang trống, không có gì để lưu!");
                return;
            }
            const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'Phieu_Hoc_Tap_Toan.txt'; 
            a.click();
        });

        // Sự kiện Mở File
        loadFileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                editor.value = e.target.result;
                updatePreview(); 
            };
            reader.readAsText(file);
            
            event.target.value = ''; 
        });

        // Sự kiện Giải toán AI
        solveBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            const question = editor.value.trim();

            if (!apiKey) { alert("Vui lòng nhập Google Gemini API Key!"); return; }
            if (!question) { alert("Vui lòng nhập bài toán!"); return; }

            preview.innerHTML = "<div style='text-align: center; color: var(--primary-color); margin-top: 20px;'><b>Đang suy nghĩ...</b></div>";
            solveBtn.disabled = true; solveBtn.textContent = "Đang xử lý...";

            try {
                const systemInstruction = `Bạn là một giáo viên Toán cấp 3 xuất sắc tại Việt Nam. Hãy giải chi tiết bài toán sau theo các bước logic, bám sát chương trình GDPT 2018. Sử dụng mã LaTeX chuẩn. Sử dụng dấu $ cho công thức cùng dòng và dấu $$ cho công thức tách dòng độc lập. Đề bài: ${question}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: systemInstruction }] }] })
                });

                if (!response.ok) throw new Error(`Lỗi API: ${response.status}`);
                const data = await response.json();
                
                if (data.candidates && data.candidates.length > 0) {
                    preview.innerHTML = formatMarkdown(data.candidates[0].content.parts[0].text);
                    renderMathJax();
                } else throw new Error("Không nhận được kết quả.");
            } catch (error) {
                preview.innerHTML = `<div style="color: red;"><b>Lỗi:</b> ${error.message}</div>`;
            } finally {
                solveBtn.disabled = false; solveBtn.textContent = "💡 Giải Toán";
            }
        });

        updatePreview();
    </script>
</body>
</html>
